<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TermuxPanel — Minecraft 服务端管理器</title>
    <meta name="description" content="Modern Minecraft Server Management Panel for Termux">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛏️</text></svg>">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="login-screen hidden">
        <div class="login-container">
            <div class="lang-switch lang-switch-corner"></div>
            <div class="login-logo">
                <div class="login-icon">⛏️</div>
                <h1>TermuxPanel</h1>
                <p class="login-subtitle" data-i18n="login.subtitle">Minecraft 服务端管理器</p>
            </div>
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="login-password" data-i18n="login.password">密码</label>
                    <input type="password" id="login-password" data-i18n-placeholder="login.passwordPlaceholder" placeholder="请输入密码" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full" id="login-btn" data-i18n="login.signIn">登录</button>
                <div id="login-error" class="login-error hidden"></div>
            </form>
        </div>
    </div>

    <!-- Setup Screen -->
    <div id="setup-screen" class="login-screen hidden">
        <div class="login-container">
            <div class="lang-switch lang-switch-corner"></div>
            <div class="login-logo">
                <div class="login-icon">⛏️</div>
                <h1 data-i18n="setup.welcome">欢迎使用 TermuxPanel</h1>
                <p class="login-subtitle" data-i18n="setup.subtitle">请设置管理员密码</p>
            </div>
            <form id="setup-form" class="login-form">
                <div class="form-group">
                    <label for="setup-password" data-i18n="setup.createPassword">创建密码</label>
                    <input type="password" id="setup-password" data-i18n-placeholder="setup.choosePlaceholder" placeholder="请设置一个密码" minlength="4" required>
                </div>
                <div class="form-group">
                    <label for="setup-confirm" data-i18n="setup.confirmPassword">确认密码</label>
                    <input type="password" id="setup-confirm" data-i18n-placeholder="setup.confirmPlaceholder" placeholder="再次输入密码" minlength="4" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full" data-i18n="setup.createAccount">创建账号</button>
                <div id="setup-error" class="login-error hidden"></div>
            </form>
        </div>
    </div>

    <!-- Main Application -->
    <div id="app" class="app-layout hidden">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <span class="logo-icon">⛏️</span>
                    <div class="logo-text">
                        <span class="logo-title">TermuxPanel</span>
                        <span class="logo-version">v2.2</span>
                    </div>
                </div>
                <button class="sidebar-close" id="sidebar-close">✕</button>
            </div>

            <!-- Server Status Badge -->
            <div class="sidebar-status">
                <div class="status-indicator" id="sidebar-status-indicator">
                    <span class="status-dot"></span>
                    <span class="status-text" data-i18n="status.offline">离线</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="#dashboard" class="nav-item active" data-page="dashboard">
                    <span class="nav-icon">📊</span>
                    <span class="nav-label" data-i18n="nav.dashboard">仪表盘</span>
                </a>
                <a href="#console" class="nav-item" data-page="console">
                    <span class="nav-icon">💻</span>
                    <span class="nav-label" data-i18n="nav.console">控制台</span>
                </a>
                <a href="#files" class="nav-item" data-page="files">
                    <span class="nav-icon">📁</span>
                    <span class="nav-label" data-i18n="nav.files">文件管理</span>
                </a>
                <a href="#jars" class="nav-item" data-page="jars">
                    <span class="nav-icon">☕</span>
                    <span class="nav-label" data-i18n="nav.jars">JAR 管理</span>
                </a>
                <a href="#properties" class="nav-item" data-page="properties">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-label" data-i18n="nav.properties">服务端配置</span>
                </a>
                <a href="#backups" class="nav-item" data-page="backups">
                    <span class="nav-icon">💾</span>
                    <span class="nav-label" data-i18n="nav.backups">备份</span>
                </a>
                <a href="#scheduler" class="nav-item" data-page="scheduler">
                    <span class="nav-icon">⏰</span>
                    <span class="nav-label" data-i18n="nav.scheduler">定时任务</span>
                </a>
                <a href="#settings" class="nav-item" data-page="settings">
                    <span class="nav-icon">🔧</span>
                    <span class="nav-label" data-i18n="nav.settings">设置</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="lang-switch lang-switch-sidebar"></div>
                <button class="btn btn-ghost btn-sm" id="logout-btn">
                    <span>🚪</span> <span data-i18n="nav.logout">退出登录</span>
                </button>
            </div>
        </aside>

        <!-- Mobile Header -->
        <header class="mobile-header" id="mobile-header">
            <button class="hamburger" id="hamburger">☰</button>
            <span class="mobile-title">TermuxPanel</span>
            <div class="mobile-header-actions">
                <div class="lang-switch lang-switch-mobile"></div>
                <div class="mobile-status" id="mobile-status-dot"></div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="main-content" id="main-content">
            <!-- Pages rendered dynamically by app.js -->
        </main>

        <!-- Overlay for mobile sidebar -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- Mobile Bottom Nav -->
        <nav class="mobile-nav">
            <a href="#dashboard" class="mobile-nav-item active" data-page="dashboard">
                <span class="mobile-nav-icon">📊</span>
                <span class="mobile-nav-label" data-i18n="nav.statusShort">状态</span>
            </a>
            <a href="#console" class="mobile-nav-item" data-page="console">
                <span class="mobile-nav-icon">💻</span>
                <span class="mobile-nav-label" data-i18n="nav.console">控制台</span>
            </a>
            <a href="#files" class="mobile-nav-item" data-page="files">
                <span class="mobile-nav-icon">📁</span>
                <span class="mobile-nav-label" data-i18n="nav.filesShort">文件</span>
            </a>
            <a href="#settings" class="mobile-nav-item" data-page="settings">
                <span class="mobile-nav-icon">🔧</span>
                <span class="mobile-nav-label" data-i18n="nav.settings">设置</span>
            </a>
        </nav>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Modal Container -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h3 id="modal-title"></h3>
                <button class="modal-close" id="modal-close">✕</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer" id="modal-footer"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
